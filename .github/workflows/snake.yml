# Redraws the contribution-graph snake every day and publishes it to the `output` branch,
# which the README loads the images from.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF2BD6&color_dots=#ebedf0,#c7f9ff,#5cecff,#00c2d6,#007a87
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161320,#3b0a45,#7a1a8c,#c02bd6,#ff2bd6&color_background=#07060D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
